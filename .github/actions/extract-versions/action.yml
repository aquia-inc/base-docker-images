name: 'Extract Language Versions'
description: 'Extracts language versions from built container images'
inputs:
  image-base-name:
    description: 'Base image name (e.g., python-base)'
    required: true
  image-tag:
    description: 'Full image tag to extract versions from'
    required: true
  platform:
    description: 'Platform for the container'
    required: true
  platform-suffix:
    description: 'Platform suffix for file naming'
    required: true
outputs:
  versions-file:
    description: 'Path to the generated versions file'
    value: ${{ steps.extract.outputs.versions_file }}
  extraction-success:
    description: 'true if extraction succeeded, false otherwise'
    value: ${{ steps.extract.outputs.extraction_success }}

runs:
  using: 'composite'
  steps:
    - name: Extract versions from container
      id: extract
      shell: bash
      env:
        INPUT_IMAGE_BASE_NAME: ${{ inputs.image-base-name }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_PLATFORM_SUFFIX: ${{ inputs.platform-suffix }}
      # github-env: values are read from /tmp/versions.txt inside our own built
      # image (a controlled build artifact, not external input), so the dynamic
      # env write below is safe. The version vars feed docker/metadata-action labels.
      run: | # zizmor: ignore[github-env]
        image_base_name="$INPUT_IMAGE_BASE_NAME"
        test_tag="$INPUT_IMAGE_TAG"
        platform="$INPUT_PLATFORM"
        platform_suffix="$INPUT_PLATFORM_SUFFIX"
        output_file="env.versions.${platform_suffix}"
        extraction_status="false"

        echo "=== Version Extraction ==="
        echo "Image base name: $image_base_name"
        echo "Test tag: $test_tag"
        echo "Platform: $platform"
        echo "Output file: $output_file"

        # Only extract versions for language-specific images
        if [[ "$image_base_name" == "python-base" || "$image_base_name" == "nodejs-base" || "$image_base_name" == "openjdk17-base" || "$image_base_name" == "go-base" || "$image_base_name" == "go-base-1.27" ]]; then
            echo "Attempting to extract versions from $test_tag for $image_base_name"
            
            # Extract versions from the container
            if docker run --rm --platform "$platform" --entrypoint="/bin/ash" "$test_tag" -c 'cat /tmp/versions.txt' > "$output_file" 2>/dev/null; then
                if [ -s "$output_file" ]; then
                    echo "Versions extracted successfully to $output_file"
                    echo "Contents:"
                    cat "$output_file"
                    extraction_status="true"
                    
                    # Set environment variables for metadata action. Values come from
                    # /tmp/versions.txt inside our own built image (a controlled build
                    # artifact, not external input), so the dynamic env write is safe.
                    while IFS='=' read -r key value; do
                      echo "${key}=${value}" >> "$GITHUB_ENV"
                    done < "$output_file"
                else
                    echo "Warning: Command succeeded but extracted versions file '$output_file' is empty."
                    rm -f "$output_file"
                fi
            else
                echo "Warning: Failed to execute version extraction in container $test_tag. Exit code: $?"
                rm -f "$output_file"
            fi
        else
            echo "No version extraction needed for $image_base_name."
        fi

        echo "extraction_success=$extraction_status" >> "$GITHUB_OUTPUT"
        if [[ "$extraction_status" == "true" ]]; then
          echo "versions_file=$output_file" >> "$GITHUB_OUTPUT"
        else
          echo "versions_file=" >> "$GITHUB_OUTPUT"
        fi