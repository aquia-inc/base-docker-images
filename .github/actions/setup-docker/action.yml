name: 'Setup Docker Environment'
description: 'Sets up Docker buildx and logs into GHCR'
inputs:
  registry:
    description: 'Container registry URL'
    required: true
    default: 'ghcr.io'
  username:
    description: 'Registry username'
    required: true
  password:
    description: 'Registry password/token'
    required: true
  platform:
    description: 'Target platform (e.g., linux/amd64)'
    required: false
    default: 'unknown'
outputs:
  cache-key:
    description: 'Generated cache key for builds'
    value: ${{ steps.cache-key.outputs.key }}

runs:
  using: 'composite'
  steps:
    - name: Login to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    # QEMU is deliberately not installed. Every consumer of this action now
    # builds, tests and inspects images for the architecture of the runner it is
    # already on: publish-base-images runs each matrix leg on a runner of its own
    # architecture, and daily-scan-and-rebuild only reads remote manifests and
    # scans registry images, neither of which executes a foreign-architecture
    # binary. Installing emulation that nothing uses only costs time.

    - name: Generate cache key
      id: cache-key
      shell: bash
      env:
        INPUT_PLATFORM: ${{ inputs.platform }}
        GH_REPOSITORY: ${{ github.repository }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        platform_safe="${INPUT_PLATFORM//\//-}"
        echo "key=${GH_REPOSITORY}-docker-${RUNNER_OS}-${platform_safe}" >> "$GITHUB_OUTPUT"
