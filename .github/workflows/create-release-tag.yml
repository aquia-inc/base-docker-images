name: Create Release Tag

on:
  # only react to changes on the main branch.
  push:
    branches: [main]
  # workflow_dispatch for manual runs.
  workflow_dispatch:
# Minimal default; each job opts into exactly what it needs.
permissions: {}

# One run at a time. Two merges in quick succession would otherwise both read
# the same newest release tag and compute the same next version for an image.
concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  detect_changed_images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images_matrix: ${{ steps.build_matrix.outputs.images_to_build }}
      has_changes: ${{ steps.build_matrix.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false  # read-only job (git diff against release tags); no push here

      # An image is released when anything that goes into it changed since its
      # newest release tag: its Dockerfile, its structure tests, every local
      # file the Dockerfile COPYs or ADDs, and the inputs shared by all images.
      # The set is derived from each Dockerfile (scripts/release-inputs.py), so
      # a new COPY is covered the day it is added.
      #
      # Comparing against the release tag rather than this push's previous
      # commit also means a change merged while tagging failed is picked up by
      # the next run instead of never shipping. The script fails rather than
      # report "nothing changed" when it cannot tell.
      - name: Detect images whose build inputs changed
        id: build_matrix
        run: |
          set -euo pipefail
          images="$(python3 scripts/release-inputs.py changed)"
          echo "images_to_build=${images}" >> "$GITHUB_OUTPUT"
          if [ "$images" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No image has a changed build input."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Releasing: ${images}"
          fi

  create_release_tags:
    needs: detect_changed_images
    if: needs.detect_changed_images.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only; the tag push authenticates with the deploy key
    strategy:
      fail-fast: false
      matrix:
        image_name: ${{ fromJSON(needs.detect_changed_images.outputs.images_matrix) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The tag push authenticates with a repository deploy key rather than
          # a personal access token. Both can trigger the downstream publish
          # workflow, which the default GITHUB_TOKEN cannot, but a deploy key is
          # scoped to this repository alone, where a PAT carries whatever its
          # owner can reach.
          #
          # persist-credentials is therefore true here: the key has to remain
          # configured for the push step below. The runner removes it in
          # post-job cleanup.
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: true

      - name: Display processing image
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          echo "Processing image: $IMAGE_NAME"

      - name: Find latest tag for image
        id: latest_tag
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          echo "Looking for existing tags for $IMAGE_NAME..."
          latest=$(git for-each-ref --sort='-v:refname' \
            --format '%(refname:short)' \
            "refs/tags/release/$IMAGE_NAME" | head -n 1)

          if [ -n "$latest" ]; then
            # Extract semver from tag (remove 'v' prefix)
            semver=$(echo "$latest" | grep -oP 'v\d+\.\d+\.\d+' | sed 's/v//')
            echo "Found latest tag: $latest (version: $semver)"
          else
            semver="0.0.0"
            echo "No existing tags found, starting from $semver"
          fi

          echo "current_semver=$semver" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next_version
        uses: WyriHaximus/github-action-next-semvers@d079934efaf011a4cf8912d4637097fe35d32b93 # v1
        with:
          version: ${{ steps.latest_tag.outputs.current_semver }}

      - name: Display version information
        run: |
          echo "Current version: ${{ steps.latest_tag.outputs.current_semver }}"
          echo "Next patch version: ${{ steps.next_version.outputs.patch }}"
          echo "Next minor version: ${{ steps.next_version.outputs.minor }}"
          echo "Next major version: ${{ steps.next_version.outputs.major }}"

      - name: Create and push release tag
        if: github.event.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          NEXT_PATCH: ${{ steps.next_version.outputs.patch }}
        run: |
          # A tag pushed with the default GITHUB_TOKEN does NOT trigger the
          # downstream publish-base-images workflow; one pushed with a deploy
          # key does. If the DEPLOY_KEY secret were missing or empty, checkout
          # would silently fall back to token authentication and the push would
          # SUCCEED while triggering nothing - a release that looks published
          # and never builds.
          #
          # So the remote is checked rather than the secret: an ssh remote is
          # proof the key was actually used.
          origin_url="$(git remote get-url origin)"
          case "$origin_url" in
            git@github.com:*|ssh://git@github.com/*) ;;
            *)
              echo "::error::origin is '${origin_url}', not ssh. The DEPLOY_KEY secret is missing or empty, so this tag would be pushed with GITHUB_TOKEN and would not trigger publish-base-images."
              exit 1
              ;;
          esac

          # Configure git for bot user
          git config user.email "aquia-base-images-bot@users.noreply.github.com"
          git config user.name "Aquia Base Images Bot"

          # Create new tag with next patch version
          new_tag="release/${IMAGE_NAME}/v${NEXT_PATCH}"
          tag_message="Release ${IMAGE_NAME}/v${NEXT_PATCH}"

          echo "Creating tag: $new_tag"
          echo "Tag message: $tag_message"

          git tag -a "$new_tag" -m "$tag_message"

          # Pushed over ssh with the deploy key configured by checkout, so no
          # credential appears on the command line or in the remote URL.
          git push origin "$new_tag"

          echo "[ok] Successfully created and pushed tag: $new_tag"
