# .github/workflows/daily-scan-rebuild.yml
name: Daily Vulnerability Scan and Rebuild

on:
  schedule:
    # Runs daily at 10:00 UTC (5 AM EST / 6 AM EDT)
    - cron: '0 10 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GH_REPO: ${{ github.repository }}
  TRIGGER_SEVERITIES: "CRITICAL,HIGH,MEDIUM"
  # One source of truth for the scanner version, because it is needed in two
  # places: the installer input and the check that the install produced what
  # was asked for. Renovate updates this line; it cannot rewrite a bare string
  # inside a run block, so a second hardcoded copy silently goes stale and
  # fails the job on the next bump.
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "0.75.0"

jobs:
  scan_and_rebuild:
    runs-on: ubuntu-latest
    outputs:
      stale_checked: ${{ steps.stale_latest.outputs.checked }}
      stale_report: ${{ steps.stale_latest.outputs.report }}
    permissions:
      # Read only: rebuild tags are pushed with the repository deploy key, not
      # with GITHUB_TOKEN, so this token needs no write access at all.
      contents: read
      packages: read     # Needed to pull images and inspect manifests
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Required to list tags
          # Rebuild tags are pushed with a repository deploy key rather than a
          # personal access token. Both can trigger the downstream publish
          # workflow, which GITHUB_TOKEN cannot, but a deploy key is scoped to
          # this repository alone. persist-credentials keeps the key configured
          # for the push below; the runner removes it in post-job cleanup.
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: true

      - name: Discover available base images
        id: discover_images
        run: |
          BASE_NAMES=$(find . -maxdepth 1 -name 'Dockerfile.*' -type f -printf '%f\n' | sed 's/^Dockerfile\.//' | sort -u | paste -sd ' ')
          if [ -z "$BASE_NAMES" ]; then
            echo "::error::No Dockerfiles found matching 'Dockerfile.*'"
            exit 1
          fi
          echo "Discovered image base names: $BASE_NAMES"
          echo "IMAGE_BASE_NAMES=$BASE_NAMES" >> "$GITHUB_ENV"

      - name: Setup Docker environment
        uses: $/.github/actions/setup-docker  # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag - a $/ self-repository ref resolves at this workflow's own commit and cannot be repointed
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Replaces a curl of contrib/install.sh from the trivy repository's MAIN
      # BRANCH piped into sh. That fetched whatever that moving ref happened to
      # contain at the time and executed it on a runner that holds this
      # repository's deploy key, and the script was not pinned to the release
      # it installed - so the pin on TRIVY_VERSION secured the binary while the
      # thing choosing and fetching the binary was unpinned.
      #
      # The action is pinned by commit, and the version it installs is pinned
      # separately below and kept current by Renovate.
      - name: Install Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          cache: false

      - name: Confirm the scanner version actually installed
        run: |
          # Printed and asserted rather than trusted: a silent fallback to a
          # different version would change what this gate reports. Grep for the
          # Version line specifically - "trivy --version" can lead with a
          # config-load line.
          #
          # Compared against the same variable the installer was given, so this
          # cannot disagree with the pin.
          trivy --version
          installed="$(trivy --version | awk '/^Version:/ {print $2; exit}')"
          if [ "$installed" != "${TRIVY_VERSION}" ]; then
            echo "::error::expected trivy ${TRIVY_VERSION}, got '${installed}'"
            exit 1
          fi

      - name: Scan images and determine rebuild requirements
        id: scan_check_rebuild
        run: |
          set -e # Exit on most errors, but parsing/scan failures handled below

          needs_rebuild_list=""
          scan_errors=""
          push_failures=""

          if [ -z "$IMAGE_BASE_NAMES" ]; then
              echo "::error::IMAGE_BASE_NAMES environment variable is not set. Discovery might have failed."
              exit 1
          fi
          echo "Processing image base names: $IMAGE_BASE_NAMES"

          for base_name in $IMAGE_BASE_NAMES; do
            echo "=== Processing image base name: $base_name ==="
            found_fixable_vulns_for_base=false
            rebuild_reason=""

            for platform_suffix in linux-amd64 linux-arm64; do
              image_name="${base_name}-${platform_suffix}"
              full_image_tag="${REGISTRY}/${GH_REPO}/${image_name}:latest"

              echo "Checking image: $full_image_tag"

              # Check if image exists before scanning
              if ! docker manifest inspect "$full_image_tag" > /dev/null 2>&1; then
                echo "::warning::Image $full_image_tag not found in registry. Skipping scan for this platform."
                continue # Skip to next platform
              fi

              echo "Scanning $full_image_tag for vulnerabilities (severities: ${{ env.TRIGGER_SEVERITIES }})"
              # The platform must be stated explicitly. These are single-platform
              # images, and the runner is amd64, so Trivy would otherwise default to
              # the host platform and die on the arm64 image with
              # "no child with platform linux/amd64 in index ...-linux-arm64".
              scan_platform="${platform_suffix/linux-/linux/}"

              # Output is captured because Trivy exits 1 BOTH for "findings were
              # found" and for a fatal scan error, so the exit code alone cannot
              # distinguish them. Treating an error as a finding silently queues
              # every image for rebuild on every run and destroys the signal.
              scan_log="$(mktemp)"
              if trivy image \
                --platform "$scan_platform" \
                --ignore-unfixed \
                --exit-code 1 \
                --severity "${{ env.TRIGGER_SEVERITIES }}" \
                --format table \
                "$full_image_tag" > "$scan_log" 2>&1; then
                cat "$scan_log"
                echo "[ok] No fixable vulnerabilities found in $full_image_tag"
              else
                scan_exit_code=$?
                cat "$scan_log"
                if grep -qE '(FATAL|Fatal error)' "$scan_log"; then
                  echo "::warning::Trivy could not scan $full_image_tag (exit $scan_exit_code). Not treating this as a vulnerability finding."
                  scan_errors="${scan_errors} ${full_image_tag}"
                elif [ $scan_exit_code -eq 1 ]; then
                  echo "[warn] Fixable vulnerabilities found in $full_image_tag"
                  found_fixable_vulns_for_base=true
                else
                  echo "[fail] Trivy scan failed for $full_image_tag (exit code: $scan_exit_code)"
                  scan_errors="${scan_errors} ${full_image_tag}"
                fi
              fi
              rm -f "$scan_log"
            done # End platform loop

            # Rebuild whenever fixable vulnerabilities are found. Fixes often ship as apk
            # package updates (e.g. python-3.13 r0 -> r2) with no base image digest change,
            # so we must NOT gate the rebuild on base image freshness - the build pulls the
            # latest packages via apk regardless. Base image freshness is logged for context.
            if [ "$found_fixable_vulns_for_base" = true ]; then
              echo "[rebuild] Fixable vulnerabilities found for $base_name. Adding to rebuild list."
              needs_rebuild_list="${needs_rebuild_list} ${base_name}"
              rebuild_reason="Fixable vulnerabilities found; rebuilding to pick up latest packages."

              # Informational: report base image freshness (does not gate the rebuild)
              dockerfile="Dockerfile.$base_name"
              if [ -f "$dockerfile" ]; then
                from_line=$(grep -i '^FROM' "$dockerfile" | head -n 1)
                from_image_name=$(echo "$from_line" | sed -E -n 's/^FROM\s+([^@]+)@sha256:.*/\1/p' | xargs)
                current_sha_with_prefix=$(echo "$from_line" | sed -E -n 's/.*(@sha256:[a-f0-9]{64}).*/\1/p')
                if [ -n "$from_image_name" ] && [ -n "$current_sha_with_prefix" ]; then
                  current_sha_digest="${current_sha_with_prefix#@}"
                  if latest_sha_digest=$(docker manifest inspect "$from_image_name" 2>/dev/null | jq -r 'if type == "array" then .[0].digest else (.manifests[0].digest // .config.digest // .digest) end // empty'); then
                    if [ -n "$latest_sha_digest" ] && [ "$current_sha_digest" != "$latest_sha_digest" ]; then
                      echo "[info] Base image [$from_image_name] also has a newer digest available ($latest_sha_digest)."
                    else
                      echo "[info] Base image [$from_image_name] is current; fix expected via apk package update."
                    fi
                  fi
                fi
              fi
            else
              echo "[ok] No fixable vulnerabilities found for $base_name"
              rebuild_reason="No fixable vulnerabilities found."
            fi
            echo "Decision for $base_name: $rebuild_reason"
          done # End base_name loop

          # Refresh tags before computing rebuild versions. create-release-tag runs
          # on every push to main, so a tag created after this job checked out
          # would otherwise be invisible here and cause a push collision.
          git fetch --tags --force --quiet || true

          # Process rebuild list
          unique_needs_rebuild=$(echo "$needs_rebuild_list" | xargs -n1 | sort -u | xargs)

          if [ -z "$unique_needs_rebuild" ]; then
            echo "[ok] No images require rebuilding based on vulnerability scans and base image freshness checks."
            echo "triggered_rebuilds=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[trigger] Triggering rebuilds for: $unique_needs_rebuild"
          echo "triggered_rebuilds=true" >> "$GITHUB_OUTPUT"
          echo "rebuild_list=$unique_needs_rebuild" >> "$GITHUB_OUTPUT"

          # Configure git for creating tags
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A tag pushed with the default GITHUB_TOKEN does NOT trigger the
          # downstream publish-base-images workflow, so it would be a silent
          # no-op: the rebuild would appear to have been requested and nothing
          # would build. A deploy key does trigger it.
          #
          # If the DEPLOY_KEY secret were missing or empty, checkout would fall
          # back to token authentication and every push below would succeed
          # while triggering nothing. The remote is therefore checked rather
          # than the secret: an ssh remote is proof the key was actually used.
          origin_url="$(git remote get-url origin)"
          case "$origin_url" in
            git@github.com:*|ssh://git@github.com/*) ;;
            *)
              echo "::error::origin is '${origin_url}', not ssh. The DEPLOY_KEY secret is missing or empty, so rebuild tags would be pushed with GITHUB_TOKEN and would trigger nothing."
              exit 1
              ;;
          esac

          for base_name in $unique_needs_rebuild; do
            echo "Creating rebuild tag for $base_name..."

            # Find latest release tag
            latest_release_tag=$(git tag --list "release/${base_name}/v*" | sort -V | tail -n 1)

            if [ -z "$latest_release_tag" ]; then
              echo "::error::Could not find any release tag matching 'release/${base_name}/v*' to base the rebuild on. Skipping rebuild trigger for $base_name."
              continue
            fi
            echo "Latest release tag found: $latest_release_tag"

            # Extract version and create rebuild tag
            version_part=$(echo "$latest_release_tag" | sed -n "s|release/${base_name}/\(v.*\)|\1|p")
            if [ -z "$version_part" ]; then
              echo "::error::Could not extract version part from tag '$latest_release_tag'. Skipping rebuild for $base_name."
              continue
            fi

            # Increment patch version for clean semver
            version_part_clean="${version_part%%+*}"
            # Extract current version numbers (e.g., v1.2.3 -> 1 2 3)
            version_nums="${version_part_clean#v}"
            version_nums="${version_nums//./ }"
            major=$(echo "$version_nums" | cut -d' ' -f1)
            minor=$(echo "$version_nums" | cut -d' ' -f2)
            patch=$(echo "$version_nums" | cut -d' ' -f3)
            
            # Increment patch version
            new_patch=$((patch + 1))
            new_version="v${major}.${minor}.${new_patch}"
            new_tag="release/${base_name}/${new_version}"

            # A rebuild tag for this version may already exist: create-release-tag
            # runs on every push to main and computes the same "latest patch + 1",
            # so a merge landing minutes before this job wins the race. That means a
            # rebuild is already in flight for this image, which is the outcome we
            # wanted, so skip it rather than failing the whole run and stranding the
            # images that have not been processed yet.
            if git rev-parse -q --verify "refs/tags/$new_tag" > /dev/null 2>&1; then
              echo "[skip] $new_tag already exists; a rebuild for $base_name is already in flight."
              continue
            fi

            echo "Creating and pushing rebuild tag: $new_tag"
            git tag "$new_tag"
            if git push origin "$new_tag"; then
              echo "[ok] Rebuild triggered for $base_name by pushing tag $new_tag"
            else
              echo "::warning::Could not push $new_tag for $base_name; continuing with the remaining images."
              git tag -d "$new_tag" > /dev/null 2>&1 || true
              push_failures="${push_failures} ${base_name}"
            fi
          done

          # Surface problems that were deliberately not allowed to abort the run.
          # A scan error is not a vulnerability finding, but it does mean an image
          # went unchecked, so it must not pass silently.
          if [ -n "$scan_errors" ]; then
            echo "::error::Images that could not be scanned:${scan_errors}"
          fi
          if [ -n "$push_failures" ]; then
            echo "::error::Images whose rebuild tag could not be pushed:${push_failures}"
          fi
          if [ -n "$scan_errors" ] || [ -n "$push_failures" ]; then
            exit 1
          fi

      # Scanning :latest says whether the published image is clean; it cannot
      # say whether it is the image that should be published. A release whose
      # publish failed, or a tag that never started one, leaves :latest on an
      # older build that may scan clean, and nothing else would notice.
      #
      # So each image's :latest (both architectures and the multi-arch tag) is
      # compared with its newest release tag. A publish still running is fine;
      # anything else is reported, with the reason, by the job below.
      - name: Check that each published :latest is the newest release
        id: stale_latest
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUST_REBUILT: ${{ steps.scan_check_rebuild.outputs.rebuild_list }}
        run: |
          set -euo pipefail
          python3 scripts/publish-report.py stale --repo "$GH_REPO" --registry "$REGISTRY" \
            --images "$IMAGE_BASE_NAMES" --skip "${JUST_REBUILT:-}" --out stale-latest.md
          {
            echo "checked=true"
            echo "report<<STALE_LATEST_EOF"
            cat stale-latest.md
            echo "STALE_LATEST_EOF"
          } >> "$GITHUB_OUTPUT"

  # Separate job so issues: write is granted to the reporting only, not to the
  # job that holds the deploy key and pulls images. Keeps one tracking issue:
  # opened or commented on while any :latest is behind, closed once none is.
  report_stale_latest:
    needs: scan_and_rebuild
    if: ${{ !cancelled() && needs.scan_and_rebuild.outputs.stale_checked == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPORT: ${{ needs.scan_and_rebuild.outputs.stale_report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPORT" > stale-latest.md
          python3 scripts/publish-report.py tracking-issue --repo "$REPO" \
            --label stale-latest --title "Published :latest is behind its newest release" \
            --intro "The daily scan found images whose published :latest is not their newest release, so that release never reached consumers:" \
            --report stale-latest.md --run-url "$RUN_URL"
