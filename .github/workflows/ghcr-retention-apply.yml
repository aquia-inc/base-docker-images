# GHCR retention: delete what the retention plan deletes.
#
# Policy (README "Image Retention", announced in #758): each image keeps its
# newest 30 releases and every release younger than 90 days; latest,
# still-moving tracking tags and the frozen or retired FIPS tags are never
# removed; older releases are deleted with their signatures and attestations.
#
# Dispatched by hand, from main only, and never scheduled. It takes no inputs:
# the limits below are part of the reviewed code, so changing what a run may
# delete is a pull request, not a value typed into a form.
#
# scripts/ghcr-retention.py refuses to start unless the date is on or after the
# one the README announces, every safety invariant holds (including that each
# package keeps at least min(30, its release count) releases), and the plan
# deletes no more than EXPECT_AT_MOST versions. A run deletes at most
# MAX_DELETE versions, in whole groups (a release, its child manifests and its
# signatures), children first, and stops early at the API rate floor;
# dispatch it again to continue. A release that still carries a tracking tag
# waits until that tag is retired.
#
# Retiring is the retire job: after the deletion pass, every stale tracking tag
# the plan found is overwritten with the end-of-life marker (eol/Dockerfile) on
# the image's three packages, by eol/retire-tag.sh, which refuses any tag that
# no longer points where the plan saw it. The releases those tags sat on are
# deleted by the next dispatch.
#
# The deletion log lists every version id deleted: GitHub can restore a
# deleted package version for 30 days.
name: GHCR Retention Apply

on:
  workflow_dispatch:

permissions: {}

# Shared with ghcr-retention.yml: a report never overlaps a deletion.
concurrency:
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  apply:
    # Deletion runs the code on main, never a branch's.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      retire: ${{ steps.retire_list.outputs.retire }}
      retire_count: ${{ steps.retire_list.outputs.count }}
    permissions:
      contents: read  # checkout, and the release tags that define a release
      # The repository holds the admin role on packages its workflow published,
      # which is what lets this token delete their versions.
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 scripts/test_ghcr_retention.py

      - name: Apply retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upper bound on the plan's deletions: a fault detector, not a target.
          # Report run 38626113118 (2026-10-14) planned 10084; about 227 new
          # versions a day reach the registry, so by 2026-10-26 the backlog
          # can be up to about 12800. A plan above this bound is refused, and
          # the bound is raised by a pull request. Lower it once the backlog
          # has drained.
          EXPECT_AT_MOST: "13000"
          # Delete requests per run. About 1000 API requests an hour are shared
          # with every workflow in the repository; listing the packages costs
          # about 250 of them (versions and release tags, 100 a page).
          MAX_DELETE: "400"
        run: |
          set -o pipefail
          python3 scripts/ghcr-retention.py --apply \
            --expect-at-most "$EXPECT_AT_MOST" --max-delete "$MAX_DELETE" \
            --report retention-report.json --deletion-log deletion-log.json \
            --retire-list retire-list.json | tee report.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Written only once every guard passed, so an empty or missing list
      # means there is nothing to retire or the run was refused.
      - name: Read the retire list
        id: retire_list
        run: |
          set -euo pipefail
          if [ -s retire-list.json ]; then
            echo "retire=$(jq -c . retire-list.json)" >> "$GITHUB_OUTPUT"
            echo "count=$(jq length retire-list.json)" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload retention report and deletion log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: retention-apply-${{ github.run_id }}
          path: |
            retention-report.json
            deletion-log.json
            retire-list.json
          retention-days: 90
          if-no-files-found: warn

  retire:
    needs: apply
    if: needs.apply.outputs.retire_count != '' && needs.apply.outputs.retire_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read  # checkout of the marker's build context
      packages: write  # push the marker over each stale tag
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The multi-arch marker is one buildx build for both platforms, so its
      # message names the multi-arch tag; arm64 is emulated. Only the build
      # stage's compile is slow under emulation, and it is cached after the
      # first tag.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retire stale tracking tags
        env:
          RETIRE_LIST: ${{ needs.apply.outputs.retire }}
        run: |
          set -euo pipefail
          failed=0
          while IFS=$'\t' read -r image tag digest amd64 arm64; do
            echo "::group::Retire ${image}:${tag}"
            eol/retire-tag.sh "$image" "$tag" "$digest" "$amd64" "$arm64" || failed=1
            echo "::endgroup::"
          done < <(jq -r '.[] | [.image, .tag, .digest, .amd64, .arm64] | @tsv' <<<"$RETIRE_LIST")
          exit "$failed"
