# Weekly GHCR retention report. REPORT ONLY: nothing is deleted or retagged.
#
# Policy (README "Image Retention"): each image keeps its newest 30 releases
# and every release younger than 90 days; latest, still-moving tracking tags
# and the frozen or retired FIPS tags are never removed; stale tracking tags
# on out-of-window releases are retired with an end-of-life marker.
# Deletion is a later, separately reviewed change.
#
# Scheduled only. The report walks every package in the registry through the
# API, which takes minutes and is exposed to transient network failures, and
# it gates nothing, so it does not run on pull requests: every Renovate pin
# bump to this file would otherwise run it. The planner's unit tests run on
# pull requests in harden-script-tests.yml. To exercise the live path of a
# change before merging, dispatch this workflow on the branch:
#   gh workflow run "GHCR Retention Report" --ref <branch>
name: GHCR Retention Report

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 scripts/test_ghcr_retention.py

      - name: Retention report (dry run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/ghcr-retention.py --report retention-report.json | tee report.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retention report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: retention-report
          path: retention-report.json
          retention-days: 90
          if-no-files-found: warn
