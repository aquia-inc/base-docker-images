name: Security Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 08:00 UTC, clear of the retention report (06:00) and the daily
    # image scan (10:00).
    #
    # This is the only trigger that scans the FULL history. On a pull request
    # the action scans that pull request's diff range, and on a push the range
    # between before and after, so a credential committed before this workflow
    # existed has never been looked at. The scheduled run is what closes that,
    # and it is also the only thing that would notice a secret that was already
    # in the history when the scanner was added.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    # The display name is the required status check, so it stays "zizmor" and
    # must not change without updating branch protection in the same breath.
    # Without the code-scanning upload nothing else posts a check by that name.
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      # No security-events: write. Findings are reported in the job and fail
      # it, rather than being uploaded to code scanning, so this job needs no
      # write access anywhere.
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Every input is stated. Passing none inherited the action's own
          # defaults, which meant this required check ran whatever zizmor had
          # released most recently: a new release could turn every pull request
          # red without a commit touching this repository.
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.30.1
          persona: regular
          # Informational findings are excluded deliberately. There are 61 of
          # them across these workflows, none actionable as a merge gate, and a
          # blocking check that is always red teaches people to ignore it.
          min-severity: low
          # No upload to code scanning. The findings fail this job instead,
          # which is a stronger gate than an alert in a tab: a finding has to
          # be fixed or explicitly waived to merge, rather than accumulating.
          advanced-security: false

  trufflehog:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The scanner image version. Held here rather than on the action's
      # version input because Renovate reads this NAME_VERSION form; it does not
      # recognise the trufflehog action's input, and a comment above that input
      # was being silently ignored while the action pin moved on without it.
      # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
      TRUFFLEHOG_VERSION: "3.99.2"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Required by the scheduled full-history scan. With the default
          # shallow checkout it would see a single commit, succeed, and report
          # clean - indistinguishable from a history that genuinely holds no
          # secrets.
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # The action is pinned by SHA but pulls its scanner image at runtime
          # and defaults that to latest, so without this the binary doing the
          # actual work floats while everything around it is pinned. Renovate
          # moves TRUFFLEHOG_VERSION in the same pull request as the action pin.
          version: ${{ env.TRUFFLEHOG_VERSION }}
          # Reports a credential only once it has been confirmed live, which is
          # what makes this safe to block on. The action already passes --fail.
          #
          # If this fires, rotate the credential first. Do not add an exclusion
          # to go green: the finding means the secret is live right now, and
          # removing the commit does not revoke it.
          extra_args: --only-verified
