---
# Time-boxed vulnerability ignores.
#
# Every entry here MUST carry an expired_at date. Trivy enforces it: once the
# date passes the finding returns and fails the build again, which forces a
# re-review rather than letting an ignore quietly become permanent.
#
# This file is referenced by trivy.yaml (ignorefile:). Keep it empty whenever
# possible - an entry is an accepted risk, not a fix.

vulnerabilities:
  - id: CVE-2026-85091
    # zlib heap buffer overflow, MEDIUM. Alias: GHSA-g5fp-32jq-cfw2.
    # Affected range is zlib 1.3.1.2 through 1.3.2.
    #
    # Why this is ignored rather than fixed: there is no fixed package to
    # install. Wolfi ships a maximum of zlib 1.3.2-r6 on both linux/amd64 and
    # linux/arm64 (verified with "apk list zlib" in wolfi-base on both
    # architectures). Trivy reports the fix as "1.3.3-r0", which is its
    # normalisation of the upstream zlib 1.3.3 release; that version is not
    # packaged in Wolfi. wolfi-dev/os zlib.yaml is still version 1.3.2 building
    # upstream tag v1.3.2, and its 2026-09-13 commit titled
    # "fix(zlib): GHSA-g5fp-32jq-cfw2" changed only "epoch: 5" to "epoch: 6" -
    # no source patch - so r6 is a rebuild, not a remediation. wolfi-dev
    # advisories carries no entry for this CVE at all.
    #
    # The world-unpin plus "apk upgrade" in every Dockerfile is working
    # correctly; there is simply nothing newer to upgrade to, so no rebuild can
    # clear this finding.
    #
    # Why ignoring is the safer posture: the Trivy gate runs before the image
    # is pushed, so this single MEDIUM blocked every image in the repository
    # from publishing at all from 2026-09-13 onward. Holding the whole fleet
    # red stops every OTHER security update from reaching consumers, which is a
    # worse outcome than accepting one MEDIUM for which no fix exists. This is
    # also consistent with the hardening definition in README.md, which is
    # scoped to "fixable-today" CVEs.
    #
    # REMOVE THIS ENTRY when wolfi-dev/os zlib.yaml reaches 1.3.3 (or Wolfi
    # publishes an advisory recording a fixed-version that Wolfi actually
    # ships). Check with:
    #   docker run --rm cgr.dev/chainguard/wolfi-base:latest \
    #     sh -c 'apk update -q; apk list zlib' | grep -E '^zlib-[0-9]'
    statement: >-
      No fixed package exists. Wolfi ships at most zlib 1.3.2-r6 on both
      architectures; the upstream fix (zlib 1.3.3) is not packaged in Wolfi, so
      no rebuild can remediate this. Blocking on it prevents every image in the
      repository from publishing and therefore stops all other security
      updates. Accepted as a time-boxed risk pending a Wolfi zlib 1.3.3 package.
    expired_at: 2026-10-15
