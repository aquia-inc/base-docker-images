---
# Time-boxed vulnerability ignores.
#
# Every entry here MUST carry an expired_at date. Trivy enforces it: once the
# date passes the finding returns and fails the build again, which forces a
# re-review rather than letting an ignore quietly become permanent.
#
# This file is referenced by trivy.yaml (ignorefile:). Keep it empty whenever
# possible - an entry is an accepted risk, not a fix. An ignore is only
# justified while NO fixed package is installable; once the distribution ships
# a fix, remove the entry rather than letting it mask a now-fixable finding.

vulnerabilities: []
