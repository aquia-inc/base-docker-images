schemaVersion: 2.0.0

# Test Nginx base image functionality
commandTests:
  - name: "Nginx version check"
    command: "nginx"
    args: ["-v"]
    expectedError: ["nginx version: nginx/"]
    
  - name: "Nginx help available"
    command: "nginx"
    args: ["-h"]
    expectedError: ["Usage: nginx"]

  # Loads the shipped nginx.conf, including the headers-more dynamic module.
  # A module built for a different nginx version fails here with
  # "module ... version X instead of Y".
  - name: "Nginx config and modules load"
    command: "nginx"
    args: ["-t"]
    expectedError: ["test is successful"]
    excludedError: ["emerg"]

fileExistenceTests:
  - name: "Nginx binary exists"
    path: "/usr/sbin/nginx"
    shouldExist: true
    
  - name: "Nginx config exists"
    path: "/etc/nginx/nginx.conf"
    shouldExist: true

metadataTest:
  user: "nginx"