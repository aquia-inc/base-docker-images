---
# Trivy loads this file automatically from the working directory, so it
# applies to the publish gate, the daily scan and any local run in this repo.
# Reference: https://trivy.dev/latest/docs/references/configuration/config-file/
#
# Only settings Trivy actually reads belong here. Nesting matters: a key under
# the wrong parent is silently ignored rather than rejected.
#
# There are deliberately no skip-dirs or skip-files. A skipped path is a
# permanent, unreviewed blind spot: our gate would pass an image that a
# consumer's scanner still flags. Time-boxed exceptions go in the ignore file
# below, where Trivy enforces an expiry.

timeout: 2m
format: table
exit-code: 0

severity:
  - MEDIUM
  - HIGH
  - CRITICAL

# Uses the YAML form so that every ignore must carry an expired_at date, which
# Trivy enforces - an ignore cannot silently become permanent.
ignorefile: .trivyignore.yaml

pkg:
  types:
    - os
    - library

vulnerability:
  ignore-unfixed: true
